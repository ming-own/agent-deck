[workspace]
members = ["crates/canvas-core", "crates/desktop", "crates/runtime", "crates/product"]
default-members = ["crates/canvas-core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
